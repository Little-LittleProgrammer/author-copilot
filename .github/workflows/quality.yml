name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  VOLTA_FEATURE_PNPM: "1"

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Volta
        uses: volta-cli/action@v4
        with:
          volta-version: "2.0.2"

      - name: Install pinned Node.js and pnpm
        run: volta install node@24.22.2 pnpm@11.28.11

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          python-version: "3.14.10"
          enable-cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Check workspace boundaries
        run: pnpm boundaries

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Electron writing workflow E2E
        run: xvfb-run --auto-servernum pnpm --filter @author-copilot/desktop test:e2e
